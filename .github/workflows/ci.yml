name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ---------------------------------------------------------------------
  # Static checks. Fast, no services needed.
  # ---------------------------------------------------------------------
  static:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/placeholder
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/placeholder
      - name: Typecheck
        run: npx tsc -b
      - name: Lint
        run: npm run lint --if-present

  # ---------------------------------------------------------------------
  # The published OpenAPI document must match the Zod schemas.
  # This is what stops the contract the frontend reads from going stale.
  # ---------------------------------------------------------------------
  contract:
    name: OpenAPI drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/placeholder
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/placeholder
      - run: npm run build -w @eo/contracts
      - name: Fail if docs/openapi.json is out of date
        run: npm run openapi:check -w @eo/api

  # ---------------------------------------------------------------------
  # Unit tests. Pure logic: RBAC catalog, deadline maths, validators.
  # ---------------------------------------------------------------------
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/placeholder
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/placeholder
      - run: npm run build -w @eo/contracts
      - run: npx vitest run --dir packages --passWithNoTests

  # ---------------------------------------------------------------------
  # Integration tests against a real PostgreSQL with pgvector.
  # ---------------------------------------------------------------------
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: onboarding_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/onboarding_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/onboarding_test
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-ci-access
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-ci-refresh
      DEV_AUTH_BYPASS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Apply schema
        run: npx prisma db push --schema apps/api/prisma/schema.prisma --skip-generate
      - run: npm run db:generate
      - run: npm run build -w @eo/contracts
      - name: Seed
        run: npm run db:seed
      - name: Run integration tests
        run: npx vitest run --dir apps/api --passWithNoTests

  # ---------------------------------------------------------------------
  # Build everything, as a deployability check.
  # ---------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/placeholder
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/placeholder
      - run: npm run build
